- id: 2025-03-19-artur-schweidtmann
  date: '2025-03-19'
  time: 12.30-13.30
  mode: in-person
  location: ME, Hall J
  speaker: Artur Schweidtmann
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Department of Chemical Engineering
  role: Asst. Prof.
  title: Generative artificial intelligence for process engineering
  abstract: 'Generative Artificial Intelligence (GenAI) has achieved groundbreaking success in domains
    like computer vision and strategy games, often surpassing human performance. However, its adoption
    in the process industries remains limited despite immense potential. This presentation focuses on
    developing GenAI for process engineering. It begins by introducing an AI software tool for digitizing
    legacy flowsheets, including Process Flow Diagrams (PFDs) and Piping and Instrumentation Diagrams
    (P&IDs) (https://www.digitization-companion.com). Then, I will highlight innovative AI-driven solutions
    tailored to process engineering and operations, such as P&ID autocompletion, automated PFD-to-P&ID
    translation, P&ID error correction, and AI-assisted HAZOPs. The presentation concludes with real-world
    examples drawn from collaborative research projects with industry partners, showcasing the practical
    impact of these advancements.

    References:

    Schweidtmann, A. M. (2024). Generative artificial intelligence in chemical engineering. Nature Chemical
    Engineering, 1(3), 193-193.'
