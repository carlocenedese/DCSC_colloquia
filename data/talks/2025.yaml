- id: 2025-10-01-gustaf-hendeby
  date: '2025-10-01'
  time: 12.30-13.30
  mode: in-person
  location: ME, Hall H
  speaker: Gustaf Hendeby
  affiliation_short: LiU
  affiliation_full: Linköping University
  role: Associate Prof.
  title: Considerations in Distributed Tracking and Estimation
  abstract: In a world with more and more automation, it is increasingly important to be able to estimate
    (determine) different environmental properties, even if they are not directly visible in the available
    measurements. A significant special case of this is object tracking, where the existence, position,
    and movement of objects in the environment are estimated to create situational awareness. Tracking
    using a centralized architecture, where a single node processes measurements from different sensor
    nodes, is optimal in most senses. However, distributed tracking is often preferred due to its scalability
    across numerous sensor nodes, greater robustness, and adaptability to changes in the available sensor
    nodes. In some cases, it may even be the only viable option, especially when raw sensor data cannot
    be accessed. One challenge in distributed tracking is the unintentional reuse of data, commonly referred
    to as data incest. This talk will explain why data incest occurs, its negative consequences, and present
    solutions that mitigate these issues while ensuring conservative estimates. The widely used scalar
    normalized estimation error squared (NEES) measures, used to detect these problems, will be introduced.  However,
    it turns out that the often-used NEES does not give the full picture, which leads to the introduction
    of the NEES matrix, which generalizes the scalar NEES.  The NEES matrix provides more insights into
    distributed tracking challenges, revealing problematic scenarios that may appear safe under scalar
    NEES, and also which parts of the estimate exhibit this issues.
  bio: Gustaf Hendeby is an Associate Professor and Docent at the Division of Automatic Control, Linköping
    University, Sweden. His research focuses on sensor fusion and stochastic signal processing, with applications
    in nonlinear estimation, target tracking, and simultaneous localization and mapping (SLAM). He has
    held positions at the German Research Center of for Artificial Intelligence (DFKI) and the Swedish
    Defence Research Agency (FOI), and currently serves as Associate Editor-in-Chief of the Journal of
    Advances in Information Fusion and Senior Editor for IEEE Transactions on Aerospace and Electronic
    Systems. He also leads the WASP Localization and Navigation Area Cluster and has held key roles in
    organizing the IEEE FUSION conferences.
