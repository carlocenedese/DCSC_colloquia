- id: 2025-06-04-max-mendel
  date: '2025-06-04'
  time: 12.30-13.30
  mode: in-person
  location: ME, Hall H
  speaker: Max Mendel
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: Associate Prof.
  title: Securities Pricing with Dynamical Systems
  abstract: How could we use dynamical systems theory to price complex financial securities? The securities
    industry uses partial differential equations, such as Black-Scholes, for dynamic pricing. Dynamical
    systems models, however, are more generally applicable, more familiar, and powerful tools exist for
    analyzing and simulating them. The key insight is that the Hamilton-Jacobi theory connects the two
    methods; in particular, I argue that Black-Scholes can be seen as the Hamilton-Jacobi description
    of a first-order system with Langevin dynamics. I illustrate the effectiveness of dynamical systems
    theory with a Spice simulation of a high-order system for an entire economy wherein risky securities
    are traded in addition to goods and services.
