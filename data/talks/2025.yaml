- id: 2025-04-02-marta-zagorowska
  date: '2025-04-02'
  time: 12.30-13.30
  mode: in-person
  location: Lecture Hall J (ME)
  speaker: Marta Zagorowska
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: Asst. Prof.
  title: 'From control to optimization: there and back again'
  abstract: 'Designing optimal operation of energy-intensive systems is challenging because they are usually
    very complex. Even if mathematical models are available, they typically fall on either of the two
    ends of a spectrum: either too incomplete or too complicated to be useful. Instead of focusing on
    improving the model, we will focus on how we can use the design of the optimal operation to compensate
    for the complexity of the system. We will look at using optimization algorithms as controllers, because
    they have already been shown to be promising in controlling energy systems, especially when combined
    with online learning and adaptation. But are such methods actually easier to use than modelling?'
