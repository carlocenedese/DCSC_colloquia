- id: 2025-09-17-carlo-cenedese
  date: '2025-09-17'
  time: 12.30-13.30
  mode: in-person
  location: ME, Hall H
  speaker: Carlo Cenedese
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: Asst. Prof.
  title: Interventions in urban traffic mobility
  abstract: "This talk explores intervention strategies for improving urban traffic mobility, focusing\
    \ on two complementary approaches.\n \nFirst, we present a coordinated, data-driven method for controlling\
    \ urban traffic lights at a city-wide scale. Our approach introduces a closed-loop control scheme\
    \ that leverages a nonparametric model of urban traffic dynamics—used for the first time in this context—to\
    \ reduce congestion across the city. We demonstrate the effectiveness of this method in achieving\
    \ efficient traffic light coordination. We will then discuss how it can be possible to obtain a scalable\
    \ version of the proposed data-driven method.\n \nSecond, we address a class of large-scale Stackelberg\
    \ games that arise in hierarchical decision-making problems with resource constraints, specifically\
    \ in vehicle routing. In this setting, a central planner (leader) designs personalized incentives\
    \ to influence the routing choices of individual drivers (agents), who independently optimize their\
    \ own cost functions under coupling and feasibility constraints. This framework leads to a bilevel\
    \ game formulation, which we solve using the BIG Hype algorithm."
