- id: 2025-04-16-paul-louis-delacour
  date: '2025-04-16'
  time: 12.30-13.30
  mode: in-person
  location: IDE-Hall T - Joost van der Grinten, 32.A-1-020
  speaker: Paul-Louis Delacour
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: PhD
  title: Phase transition in a high-dimensional Spiked Mixture Model
  abstract: 'We will introduce our new spiked mixture model (SMM) to address the problem of estimating
    a set of signals from many randomly scaled and noisy observations.

    Numerical experiments show that in low signal-to-noise ratio (SNR) regimes, and for data types where
    the SMM is relevant, SMM surpasses the more traditional Gaussian mixture model (GMM) in terms of signal
    recovery performance.

    Finally, we will demonstrate that in big data regimes—where both the number of observations and their
    dimensionality grow without bound—a phase transition occurs, marking a critical SNR threshold beyond
    which signal recovery becomes impossible.'
