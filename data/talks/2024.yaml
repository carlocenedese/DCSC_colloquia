- id: 2024-05-01-hubald-verzijl
  date: '2024-05-01'
  time: null
  mode: in-person
  location: TBD
  speaker: Hubald Verzijl
  affiliation_short: LUMC
  affiliation_full: Leiden University Medical Center
  role: TBD
  title: 'Applying Control Engineering in Healthcare: From Theory to Practice'
  abstract: In (academic) hospitals, there are many innovative ideas/problems that could be solved by
    a 'systems and control approach'. This lecture delves into the application of control engineering
    in healthcare, showcasing some novel closed-loop strategies, such as those in pain management and
    mechanical ventilation. We will evaluate the impact of automated processes on clinical workflows,
    highlight some overlooked drawbacks, and examine how clinicians can work safely with closed-loop technology.
    We end the lecture with some current work/unsolved challenges.
  bio: 'Hubald has a master''s degree in Systems & Control (TU Delft) and Technical Medicine (TU Delft,
    track ‘Sensing & Stimulation’). During his thesis, he worked on closed-loop mitigation of neuropathic
    pain, where he worked closely with Dr. Sérgio Pequito. After graduating, he started a position as
    a clinical technologist at the Medical Technology Department of Leiden University Medical Centre (LUMC).
    Here, he works with clinicians and researchers: they mainly develop custom medical instruments that
    cannot be purchased. As a hobby, Hubald has always been enthusiastic about designing custom printed
    circuit boards (PCBs)  featuring implemented closed-loop algorithms.'
