- id: 2024-09-02-meichen-guo
  date: '2024-09-02'
  time: null
  mode: in-person
  location: TBD
  speaker: Meichen Guo
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: Associate Prof.
  title: Learning controllers from data with stability guarantee
  abstract: This talk discusses a direct data-driven control approach for linear and nonlinear dynamical
    systems without explicitly identifying a model. The core of the approach is the data-based closed-loop
    system representation under a feedback control law. Using the data-based closed-loop representation,
    stabilizing controllers can be designed by solving data-dependent linear matrix inequalities (LMIs)
    or sum of squares (SOS) conditions. In many cases, such as when the system is subject to disturbances
    and/or the data is corrupted by noise, only an uncertain closed-loop representation can be obtained,
    and thus a robust control technique is used for the data-driven control design. For nonlinear systems,
    under mild assumptions, an inner estimation of the region of attraction can be computed from data
    under the designed data-driven control law.
