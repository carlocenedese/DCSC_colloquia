- id: 2024-06-19-maarten-schoukens
  date: '2024-06-19'
  time: null
  mode: in-person
  location: TBD
  speaker: Maarten Schoukens
  affiliation_short: TU/e
  affiliation_full: Eindhoven University of Technology
  role: Associate Prof.
  title: Deep Subspace Encoders for Nonlinear System Identification and Model Augmentation
  abstract: 'Learning a state-space model for a nonlinear dynamical system starting from noisy data remains
    a challenging problem. The model can become unstable during the learning process or the optimization
    problem can get stuck in a local minimum. Using recent insights obtained from auto-encoder deep learning
    architectures and the multiple shooting literature, this presentation introduces the deep subspace
    encoder architecture (SUBNET) to estimate nonlinear state-space models. Furthermore, we illustrate
    how the proposed approach can also include knowledge from a priori available system models through
    model augmentation.


    A multi-step ahead prediction error cost function is used to trade off good free-run simulation performance
    and computational complexity. The initial state of each of these multi-step runs is obtained using
    the subspace encoder, which is estimated simultaneously with the state transition and output function
    of the model. This approach smoothens the cost function, which in turns reduces the risk of running
    into local minima, while at the same time allowing for an efficient numerical implementation through
    batch optimization methods. The use of the multi-step ahead prediction error also mitigates the problem
    of running into unstable models during learning. The nonlinear encoder, state-transition and output
    functions of the model are represented using neural networks which allows one to efficiently represent
    nonlinear systems with high-dimensional inputs and outputs (e.g. spatiotemporal systems), but allow
    to flexibly embed a priori obtained models at the same time.


    The application of the proposed ideas, using a broad range of model structures, on multiple benchmark
    examples illustrates that excellent models of the system under test can be obtained starting from
    a random parameter initialization.'
  bio: Maarten Schoukens is an Associate Professor in the Control Systems (CS) Group at the Department
    of Electrical Engineering, Eindhoven University of Technology. His main research interests include
    the measurement and data-driven modeling of nonlinear dynamical and linear parameter-varying systems
    using system identification and machine learning techniques, experimental design, and frequency domain
    methods in identification. Maarten was awarded an FWO Ph.D. Fellowship in 2011, an EU - Marie Skłodowska-Curie
    Individual Fellowship in 2018, and an ERC Starting Grant in 2022. Maarten is active as an associate
    editor for the IEEE CSS (CDC, ACC) and the ECC Conference Editorial Board, and has been active as
    an associate editor for multiple IFAC conferences. Finally, Maarten is a co-organizer of the nonlinearbenchmark.org
    initiative promoting the use of common datasets in data-driven nonlinear dynamical modeling research.
