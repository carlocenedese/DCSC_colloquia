- id: 2026-04-29-nitin-myers
  date: '2026-04-29'
  time: 12.30-13.30
  mode: in-person
  location: ME-Hall H
  speaker: Nitin Myers
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: Asst. Prof.
  title: Pushing the limits of automotive perception using context-awareness
  abstract: "Automotive sensors such as radar and LiDAR serve as the “eyes” of self-driving vehicles.\
    \ Before we move drivers to the back seat and fully rely on these sensors, it is important to understand\
    \ how human vision adapts attention to the context. This talk explores how to embed such context-awareness\
    \ into the eyes of self-driving cars. \n\nI will present an overview of our research activities on\
    \ context-aware hardware reconfiguration, adaptive scene illumination, and receiver processing. Using\
    \ a live demonstration of our context-aware LiDAR and radar-based simulations, I will show how our\
    \ methods extend perception in critical directions and achieve a higher dynamic range than conventional\
    \ systems."
