- id: 2026-02-04-shengling-shi
  date: '2026-02-04'
  time: 12.30-13.30
  mode: in-person
  location: ME-Hall H, 34.D-1-100
  speaker: Shengling Shi
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: Asst. Prof.
  title: 'Learning and Optimal Control of Dynamical Systems: Network Structure and Guarantees'
  abstract: Modeling and control of complex dynamical systems face increasing challenges as systems become
    uncertain, partially unknown, and large-scale. In this talk, I will take a data-driven perspective
    on some of these challenges and present my research on system identification and optimal control for
    building learning-based models and controllers. First, I will discuss the identification of large-scale
    dynamical networks, showing how network structure can be exploited for tasks such as identifiability
    analysis, sensor and actuator placement, and topology estimation. Applications of the above results
    will be illustrated through brain networks and a MATLAB toolbox developed with collaborators. These
    results provide foundational models that enable learning-based control. Next, I will present results
    on safety and performance guarantees for certain learning-based approaches to optimal control. The
    talk will conclude with a discussion of future research at the intersection of learning and optimal
    control for healthcare in my group, with an emphasis on physiologically plausible human motion generation
    and rehabilitation.
  bio: Shengling Shi is an Assistant Professor with the Delft Center for Systems and Control (DCSC), Delft
    University of Technology (TU Delft). He was a postdoctoral researcher at the Department of Chemical
    Engineering, Massachusetts Institute of Technology, and at DCSC, TU Delft. He received the M.Sc. degree
    (with distinction) in 2017 and the Ph.D. degree in 2021, both from the Control Systems Group at Eindhoven
    University of Technology. His research interests lie at the intersection of system identification,
    learning, and optimal control with applications in healthcare. He is a member of the IFAC Technical
    Committee on Modelling, Identification and Signal Processing.
