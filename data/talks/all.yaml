- id: 2026-01-21-angelo-caregnato-neto
  date: '2026-01-21'
  time: 12.30-13.30
  mode: in-person
  location: ME-Lecture Hall E - Robert Hooke, 34.A-0-710
  speaker: Angelo Caregnato Neto
  affiliation_short: UNICAMP
  affiliation_full: University of Campinas
  role: Postdoc
  title: Mixed-integer methods for multi-robot motion planning and decision making
  abstract: 'Any individual robot can have its applicability broadened and efficiency improved if harmoniously
    integrated with other robots. The designer of the resulting multi-robot system (MRS) faces unique
    challenges in the form of the coordination and collaboration required to unlock the full potential
    of these teams. Introducing such capabilities to MRS requires planning methods able to operate both
    across the domains of discrete high-level decision-making and continuous low-level kinematic and dynamic
    control. This scenario poses a challenge from the perspective of optimization: our most efficient
    and reliable tools usually work on continuous decision variables constrained to convex search spaces.
    Mixed-integer programming (MIP) is a framework used to cast engineering problems involving continuous
    and discrete decision variables into the form of conventional optimizations and devise algorithms
    to solve them. This talk explores the use of MIP in the design of motion planning and decision-making
    algorithms for MRS. I’ll provide a basic introduction to the subject and present a few interesting
    MRS problems that MIP was able to solve. Then, I’ll focus on its main limitation and discuss some
    lines of research being followed to address it. I’ll finish by presenting my initial work as a visiting
    postdoc at TU Delft.'
  bio: Dr. Angelo Caregnato-Neto is a postdoctoral researcher at the University of Campinas, Brazil, and
    is currently a visiting postdoc at TU Delft, The Netherlands, working primarily on optimization-based
    control architectures for multi-robot systems. Dr. Caregnato-Neto obtained his Ph.D in computer and
    electronic engineering at Aeronautics Institute of Technology, Brazil. His thesis addressed the problems
    of motion planning and decision making for multi-robot systems under network connectivity constraints.
