- id: 2026-04-08-sungho-shin
  date: '2026-04-08'
  time: 15:00 -- 16:00
  mode: online
  location: Online
  speaker: Sungho Shin
  affiliation_short: MIT
  affiliation_full: Massachusetts Institute of Technology — Department of Chemical Engineering
  role: Asst. Prof.
  title: Solving large-scale, sparse, constrained nonlinear optimization problems on GPUs
  abstract: 'In this talk, we delve into recent advancements in solving large-scale sparse nonlinear optimization
    problems on GPUs. This new approach combines three key elements: (1) the SIMD abstraction of nonlinear
    optimization problems, (2) the condensed-space interior point method approach, and (3) NVIDIA''s recently
    released sparse linear solver, CUDSS. By combining these components, we provide a comprehensive nonlinear
    optimization solution capabilities. We present numerical experiment results showcasing over 10x speed-ups
    when applying this method to large-scale AC optimal power flow problems. We will conclude the discussion
    by examining the potential implications of these findings for the future of power system optimization
    and decision-making.'
  bio: 'Sungho Shin is a Texaco-Mangelsdorf Career Development Chair Assistant Professor of the Chemical
    Engineering Department at Massachusetts Institute of Technology. Prior to joining MIT, he was a postdoctoral
    researcher at the Mathematics and Computer Science Division at Argonne National Laboratory (supervisor:
    Mihai Anitescu). He received his Ph.D. from the University of Wisconsin-Madison (advisor: Victor M.
    Zavala). He was a summer intern at Los Alamos National Laboratory (2020; worked with Carleton Coffrin
    and Kaarthik Sundar) and Argonne National Laboratory (2018; worked with Mihai Anitescu). He was an
    undergraduate researcher at Jong Min Lee''s group at Seoul National University. His research interests
    include model predictive control, optimization algorithms, and their applications to large-scale energy
    infrastructures (such as natural gas and power networks). He is the main developer of the nonlinear
    optimization solver MadNLP.jl and the automatic differentiation/algebraic modeling tool ExaModels.jl.
    He was the winner of the W. David Smith, Jr. Graduate Publication Award, AIChE Annual Meeting CAST
    Directors’ Student Presentation Award, IFAC ADCHEM Young Author Award, IFAC NMPC Young Author Award.
    He was a recipient of the Korea Presidential Science Fellowship, Kwanjeong Fellowship, and Grainger
    Wisconsin Distinguished Graduate Fellowship.'
