- id: 2026-06-03-meng-jianwen
  date: '2026-06-03'
  time: 11:00-12:00
  mode: in-person
  location: ME-Hall G
  speaker: Meng Jianwen
  affiliation_short: ESTACA
  affiliation_full: ESTACA — École Supérieure des Techniques Aéronautiques et de Construction Automobile,
    France
  role: Asst. Prof.
  title: 'Control Theory Applications in Energy Systems: A Focus on Lithium-Ion Batteries and Proton Exchange
    Membrane Fuel Cells'
  abstract: The energy crisis and environmental issues present the greatest challenges for the automobile
    industry, highlighting the need to develop alternative fuel-driven vehicles. As a result, electric
    vehicles have experienced rapid development in recent years. Lithium-ion batteries and proton exchange
    membrane fuel cells are currently the state-of-the-art power sources for electrified powertrain systems.
    From a control perspective, model-based design plays an important role in ensuring the reliable, efficient,
    and safe operation of these energy systems. This presentation aims to discuss the applications of
    control theory in lithium-ion batteries and proton exchange membrane fuel cells, with particular focus
    on state estimation, model predictive control, input-output feedback linearization, and adaptive control
    with fault-tolerant objectives. Current and future research directions will also be discussed from
    a control-oriented perspective.
  bio: 'Meng Jianwen is an Assistant Professor at ESTACA (École Supérieure des Techniques Aéronautiques
    et de Construction Automobile), a French engineering school specializing in transportation engineering.
    He received his PhD in Electrical Engineering from Paris-Saclay University in 2020 and has been working
    at ESTACA since then. Since 2024, he has also served as the Head of the Master’s program “Drone and
    Control.”

    His research focuses on health-aware control of hybrid energy systems, particularly lithium-ion batteries
    and proton exchange membrane fuel cells for electric vehicle applications. He has co-supervised four
    PhD students working on related topics in energy systems and control engineering.'
