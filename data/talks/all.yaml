- id: 2026-03-04-niccolo-ciolli
  date: '2026-03-04'
  time: 12.30-13.30
  mode: in-person
  location: ME-Lecture Hall F
  speaker: Niccolo Ciolli
  affiliation_short: DTU
  affiliation_full: Technical University of Denmark — DTU Compute, Cognitive Systems
  role: PhD
  title: 'Tensor Networks for Machine Learning: Density estimation and Polynomial regression.'
  abstract: Tensor Networks are compact representations of elements belonging to multidimensional spaces
    (tensors) as a network of elements belonging to smaller subspaces (smaller tensors). This representation
    is effectively a compression of the original space. Their applications are well known and widely adopted
    in the field of quantum matter and in recent years tensor networks have been studied in the field
    of Machine Learning, providing a compressed representation of the parameters of the model. In this
    talk we will speak of tensor networks as a tool for density estimation, leveraging probabilistic circuits,
    then their application as a polynomial regression model and ultimately we will show Bayesian inference
    with tensor networks represented parameters.
  bio: I am Niccolo', I come from Italy, Pistoia a small town close to Florence. I did my bachelor in
    Physics and Astrophysics at the University of Florence, my master in Physics of Complex Systems at
    Polytechnic of Turin, my master thesis at the University of Siegen, Germany on quantum information,
    I am currently doing a PhD in Copenhagen at DTU and at TUD until the end of March.
