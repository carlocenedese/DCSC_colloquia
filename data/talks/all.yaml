- id: 2026-04-22-diego-van-overberghe
  date: '2026-04-22'
  time: 12.30-13.30
  mode: in-person
  location: ME-Lecture Hall B
  speaker: Diego Van Overberghe
  affiliation_short: ETH Zurich
  affiliation_full: ETH Zurich — Automatic Control Laboratory (IfA)
  role: MSc
  title: Learning to Predict Traffic Signals
  abstract: Microscopic traffic simulations are vital to allow informed changes when improving or modifying
    traffic infrastructure. These insights are particularly important for urban areas, where traffic is
    significantly impacted by traffic signals and their programming. Simulations should therefore aim
    to simulate signals and their operation accurately; however, current research has focussed on either
    learning schedules where signal timings are fixed or slowly evolving; or on regressive techniques
    to estimate effects of future signal changes. We propose using a decision-tree based approach which
    aims to learn the underlying logic of the signal controller. Our method is shown to correctly recover
    traffic signal controller logic for a synthetic scenario we create. Using data from an intersection
    in Zürich, we also show that our method captures key behaviours including public transport prioritisation,
    despite not having any knowledge about the operation of the controller.
  bio: I am currently a Research Assistant at the Automatic Control Institute (IfA) at ETH Zürich, developing
    a platform to facilitate research using SUMO (Microscopic Traffic Simulator), drawing on experience
    I gained during my Master project work.
