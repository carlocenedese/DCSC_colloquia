- id: 2026-05-27-koen-scheres
  date: '2026-05-27'
  time: 12.30-13.30
  mode: in-person
  location: ME-Hall G
  speaker: Koen Scheres
  affiliation_short: KU Leuven
  affiliation_full: KU Leuven — Department of Electrical Engineering (ESAT-STADIUS)
  role: Postdoc
  title: Neuromorphic Control and Decision Making
  abstract: 'Even though computers have long since surpassed the computational capabilities of the brain,
    relatively “simple tasks” for animals and humans, such as robust locomotion in uncertain environments,
    still pose many challenges for roboticists and control theorists despite the available computing power
    in modern machines. A key challenge is the separation of fast (real-time) tracking and slow decision-making:
    tracking a reference at high bandwidth leaves little computation time between samples for decision-making,
    which necessitates a hierarchical control structure. Neuromorphic controllers, that is, controllers
    designed on the same physical principles as the central nervous system, aim to tackle this gap. However,
    the mathematical frameworks used to analyze these problems are distinct in character: tracking is
    handled via differential (difference) equations, whereas decision-making is often tackled via discrete
    event systems. In this talk, we will explore what the discrete event description of a neuromorphic
    circuit (controller) is and why it is useful to consider such circuits as discrete event systems for
    controller verification and design.'
  bio: Koen Scheres received the M.Sc. degree in mechanical engineering and the Ph.D. degree in control
    theory from the Eindhoven University of Technology (TU/e), the Netherlands, in 2020 and 2024, respectively.
    He is currently working as a postdoctoral researcher at KU Leuven, Belgium. His research interests
    include data-driven control, hybrid dynamical systems, event-triggered control and neuromorphic control.
