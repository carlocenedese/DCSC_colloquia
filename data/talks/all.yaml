- id: 2026-05-13-donatello-materassi
  date: '2026-05-13'
  time: 12.30-13.30
  mode: in-person
  location: ME-Hall G
  speaker: Donatello Materassi
  affiliation_short: UMN
  affiliation_full: University of Minnesota — Department of Electrical and Computer Engineering
  role: Asst. Prof.
  title: Inferring Causal Structure in Networks of Dynamical Systems
  abstract: 'Networks of dynamical systems provide a powerful language to model complex phenomena across
    science and engineering. While significant progress has been made in analyzing the behavior of such
    interconnected systems, the problem of reconstructing their underlying structure from data remains
    fundamentally challenging, especially when direct intervention or manipulation is limited or not feasible.
    In this seminar, we revisit network identification from a more "causal perspective". Rather than focusing
    solely on recovering interaction topologies that explain observed correlations, we ask a sharper question:
    which connections represent genuine causal influences, and under what assumptions can they be identified
    from observational data alone? Addressing this question requires disentangling dynamics, feedback,
    and latent effects, while providing a framework where correlation can be distinguished from causation
    in interconnected systems. The talk explores how ideas from system identification, graphical models,
    and causal inference can be combined to provide principled tools for inferring causal structure in
    dynamical networks. Emphasis is placed on non-invasive settings, where experimental interventions
    are infeasible, and on the role of modeling assumptions in determining what causal conclusions can
    (and cannot) be drawn. Through selected examples and theoretical insights, the seminar aims to clarify
    the opportunities and limitations of causal network reconstruction and to outline directions for developing
    interpretable, causally meaningful models of complex dynamical systems.'
  bio: Donatello Materassi is a researcher in control and dynamical systems, with expertise in nonlinear
    system identification, graphical and causal models, and interpretable machine learning. He received
    his Ph.D. from the University of Florence in 2007 and subsequently held postdoctoral research positions
    at the University of Minnesota and MIT. He has served as a lecturer at Harvard University and as an
    Assistant Professor at the University of Tennessee. He is the recipient of an NSF CAREER Award (2015)
    and is currently an Associate Professor at the University of Minnesota. His research lies at the intersection
    of system identification, causality, and explainable AI (XAI), with applications ranging from molecular
    force spectroscopy and bioinformatics to broader data-driven modeling problems.
