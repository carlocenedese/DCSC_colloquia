- id: 2026-05-08-dominic-liao-mcpherson
  date: '2026-05-08'
  time: 15:00-16:00
  mode: in-person
  location: ME-Lecture Hall F
  speaker: Dominic Liao-McPherson
  affiliation_short: UBC
  affiliation_full: University of British Columbia — Department of Mechanical Engineering
  role: Asst. Prof.
  title: A Systems-theoretic Viewpoint on Edge Computing for Predictive Control
  abstract: Intelligent systems are becoming increasingly prevalent in our society, e.g., self-driving
    cars are being developed on an industrial scale and smart grids are at the forefront of efforts to
    combat climate change. Model predictive control (MPC), a powerful optimization-based constrained control
    technique, is a key enabling technology for the next generation of intelligent systems. Often the
    most significant challenge when deploying model predictive controllers is solving complex trajectory
    optimization problems in real-time. It is often not possible to solve these problems to full optimality
    in practice due to computational limits, instead we resort to computationally cheaper suboptimal predictive
    control strategies. However, this potentially sacrifices some of MPC's stability and robustness guarantees.
    In this talk, I present Time-distributed Optimization (TDO), a unifying framework for studying the
    system theoretic consequences of computational limits in the context of Model Predictive Control (MPC).
    By framing suboptimal MPC as a feedback interconnection between the physical plant and an optimization
    algorithm, I derive sufficient conditions for stability and robustness of model predictive controllers
    under computing power and/or communication limits. Further, I illustrate the applicability of these
    methods in the real-world through diesel engine, and autonomous driving examples.
  bio: Dominic Liao-McPherson received his BASc in Engineering Science from the University of Toronto
    in 2015 and a PhD in Aerospace Engineering and Scientific Computing from the University of Michigan
    (Ann Arbor) in 2020. He was then a postdoc at the ETH Zürich Automatic Control Lab before joining
    the Mechanical Engineering department at UBC in 2023 as an Assistant Professor. His research interests
    lie at the intersection of optimization, control, and computing with applications in robotics, energy,
    and aerospace.
