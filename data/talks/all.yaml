- id: 2024-05-15-dimitris-boskos
  date: '2024-05-15'
  time: null
  mode: in-person
  location: TBD
  speaker: Dimitris Boskos
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: TBD
  title: Data-driven distributionally robust coverage optimization
  abstract: In this talk, we present a data-driven coverage control algorithm, which optimally deploys
    a team of robots across a spatial region where a random event of interest may occur. The probability
    density of this event is unknown and can only be inferred to some extent from data. To hedge against
    this distributional uncertainty, we present a data-driven ambiguity set construction, which contains
    plausible models of the unknown density and enjoys rigorous probabilistic guarantees. Using this set,
    we design a distributionally robust algorithm that optimizes the locations of the robots against the
    worst-case probability density from it. This leads to a non-smooth, non-convex optimization problem,
    which we solve by an appropriate variant the Gradient Sampling algorithm. We finally discuss conditions
    under which the algorithm is guaranteed to converge and why these are met in our problem setting.
  bio: TBD
