- id: 2025-05-07-gabriel-de-albuquerque-gleizer
  date: '2025-05-07'
  time: 12.30-13.30
  mode: in-person
  location: Pulse, hall 7, 33.A2.200
  speaker: Gabriel de Albuquerque Gleizer
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: Asst. Prof.
  title: 'Fault estimation with input design: model-based and data-driven approaches'
  abstract: "Fault estimation, in a broad sense, is the problem of modeling an undesired change in the\
    \ behavior of a system. Faults can appear as changes in dynamics due to wear and tear, unexpected\
    \ external disturbances, or losses of components such as sensors and actuators.\n\nIn this talk I\
    \ will present solutions to two classes of fault estimation problems. \n\nIn the first, I consider\
    \ the case of small multiplicative faults in a model-based approach. These can represent the degradation\
    \ of certain system components, and in applications such as the high-tech industry, need to be detected\
    \ early due to their stringent performance requirements. In this presentation, the faults are represented\
    \ as changes in parameters of a linear time-invariant system and must be estimated from its input\
    \ and output variables. The proposed real-time fault estimator is based on a residual generator used\
    \ for fault detection and a multiple-output regressor generator, which feed a moving-horizon linear\
    \ regression that estimates the parameter changes. The performance of this estimator is severely dependent\
    \ on the richness of the regressors, motivating an optimal input design problem. I present an offline\
    \ input design method that requires solving a non-convex optimization problem, for which efficient\
    \ algorithms and optimality bounds are provided. The performance of the fault estimation in an academic\
    \ model and a industrial use case will be presented, showcasing the importance of input design.\n\n\
    In the second, I go to the other extreme, a data-driven situation where the goal is to identify an\
    \ LTI system subject to controlled inputs and unobserved faults. This is motivated by situations where\
    \ a fault has never been seen, while it can impact the system dynamics and act as an external disturbance.\
    \ In this case, faults are modeled as bounded additive external disturbances. I provide a behavioral\
    \ approach to the problem formulation, and present preliminary results in computational methods that\
    \ allow the complete identification of the input-output system and of a subspace of fault-output components\
    \ and associated reconstructed signals"
  bio: TBD
  tags:
  - Modeling and System Identification
