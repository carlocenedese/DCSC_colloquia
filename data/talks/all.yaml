- id: 2026-02-18-wendelin-böhmer
  date: '2026-02-18'
  time: 12.30-13.30
  mode: in-person
  location: ME-Hall J, 34.D-1-300
  speaker: Wendelin Böhmer
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Department of Software Technology
  role: Postdoc
  title: 'Two tales of generalization: towards reliable AI in out-of-distribution situations'
  abstract: "Modern reinforcement learning (RL) methods rely on neural networks (NN) to generalize their\
    \ values and/or policies during deployment. This reliance has shown again and again to be a crucial\
    \ Achilles’ heel, preventing real-life application of learned controllers. I will introduce two perspectives\
    \ on reliable out-of-distribution (OOD) generalization in RL, based on recent publications from our\
    \ lab. \nOn the one hand, one can aim to estimate epistemic uncertainty, like disagreement of an ensemble,\
    \ to select only reliable actions. I will show that this is equivalent to acting on a pessimistic\
    \ bound on a Gaussian process with the neural tangent kernel (Zanger et al., 2024, 2025a,b). This\
    \ has an important implication for OOD generalization: the kernel is exclusively determined by the\
    \ network architecture (Engwegen et al., 2024, 2025), the learned function does not affect ensemble\
    \ disagreement.\nOn the other hand, one can characterize OOD generalization by the equivariances in\
    \ the target function, which we formulate this as symmetry groups over the input space. We exploit\
    \ recent results from behavior cloning to derive an upper bound on the generalization error of an\
    \ infinite ensemble of policies (Weltevrede et al., 2025b,a). This allows us to identify and empirically\
    \ evaluate which factors affect out-of-distribution generalization."
  bio: Wendelin is an assistant professor at TU Delft, who focuses on deep reinforcement learning, especially
    the question how an learning agent can adapt to environments that differ from training.
  tags:
  - Control and Learning
