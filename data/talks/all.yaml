- id: 2026-05-21-giuseppe-belgioioso
  date: '2026-05-21'
  time: 10:45 – 12:45
  mode: in-person
  location: ME-Lecture Hall D
  speaker: Giuseppe Belgioioso
  affiliation_short: KTH
  affiliation_full: KTH Royal Institute of Technology — Department of Decision and Control Systems
  role: Asst. Prof.
  title: Toward Online Feedback Optimization of Complex Multi-Agent Systems
  abstract: 'Online Feedback Optimization (OFO) refers to the design of feedback controllers that steer
    a physical system toward the solution of an optimization problem while enforcing operational constraints.
    The core idea is to repurpose iterative optimization algorithms as dynamic feedback controllers by
    integrating real-time measurements from the physical plant. Unlike traditional optimization-based
    control approaches, such as Model Predictive Control, these methods require limited model knowledge,
    avoid pre-computed set-points, and can be implemented with relatively low computational effort while
    fully leveraging real-time data.


    In this talk, we present several recent advances that lift the theory of Online Feedback Optimization
    from simplified academic settings to complex multi-agent systems. We address key challenges including
    systematic controller design, closed-loop stability guarantees, robustness, sampled-data implementations,
    distributed architectures, game-theoretic interactions, and other practical deployment aspects. We
    also present numerical and experimental validations on swarm robotics and multi-area power systems
    that illustrate the flexibility and broad applicability of the proposed framework.'
  bio: Giuseppe Belgioioso is an Assistant Professor at the Department of Decision and Control Systems,
    KTH Royal Institute of Technology, Sweden. He received the bachelor’s degree in information engineering
    in 2012 and the master's degree in Control Systems Engineering in 2015, both at the University of
    Padova, Italy. In 2020, he obtained the Ph.D. degree in Automatic Control at Eindhoven University
    of Technology (TU/e), The Netherlands. From 2021 to 2024, he was first a Postdoctoral researcher and
    then Senior Scientist at the Automatic Control Laboratory at ETH Zurich, Switzerland. His research
    lies at the intersection of optimization, game theory, and automatic control with applications to
    complex systems, especially electrical power grids.
