- id: 2026-03-18-anil-alan
  date: '2026-03-18'
  time: 12.30-13.30
  mode: in-person
  location: ME-Lecture Hall F
  speaker: Anil Alan
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: Postdoc
  title: 'Safety-Critical Control with Control Barrier Functions: Backup Construction and Robustness'
  abstract: 'Ensuring safety is a fundamental requirement in modern control systems operating in safety-critical
    environments such as autonomous vehicles and robotics. Control barrier functions (CBFs) provide a
    systematic framework for enforcing safety constraints by guaranteeing forward invariance of a safe
    set while minimally modifying a desired performance-oriented controller through a safety filter.


    This talk presents developments in CBF-based safety-critical control focusing on two key challenges:
    constructing suitable barrier functions and ensuring robustness to model uncertainty and disturbances.
    After introducing the safety filter framework, I focus on the backup CBF approach for constructing
    a verified CBF. In this method, a backup controller propagates trajectories into a safe terminal set,
    implicitly defining a controlled invariant set and yielding a CBF under certain conditions.


    I then discuss robustness through the concept of input-to-state safety, which extends ideas from input-to-state
    stability to quantify how disturbances affect safety guarantees and enables the design of robust safety
    filters. The methods are illustrated through the design of a longitudinal controller for an autonomous
    vehicle.'
  bio: Anil Alan is a Postdoctoral Researcher at the DCSC, TU Delft. He completed his PhD in Mechanical
    Engineering at the University of Michigan, USA, where he was awarded the Rackham Predoctoral Fellowship;
    and holds an MSc from Bilkent University, Turkey. At TU Delft, he works on an ERC Advanced Grant project
    with a focus on constraint-satisfaction methods for optimization-based control. He is the recipient
    of the Professor Pierre T. Kabamba Award and ASME’s Best Student Paper Award at the American Control
    Conference.
