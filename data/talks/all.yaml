- id: 2026-06-08-nicolas-lanzetti
  date: '2026-06-08'
  time: 15:00-16:00
  mode: in-person
  location: ME-Lecture Hall E
  speaker: Nicolas Lanzetti
  affiliation_short: Caltech
  affiliation_full: California Institute of Technology — Department of Computing and Mathematical Sciences
  role: Postdoc
  title: 'Strategically robust decision-making: from game-theoretic equilibria to multi-agent learning'
  abstract: 'In many strategic settings, agents must act against the uncertain behavior of others—behavior
    that emerges from many intertwined sources, such as incomplete information, limited computation, and
    bounded rationality, which are hard to model one by one. In this talk, I propose that each agent seeks
    protection directly against deviations around the emergent behavior itself, making decisions in the
    face of the worst-case behavior within an ambiguity set of tunable size, centered at the emergent
    behavior implicitly defined. This gives rise to a novel equilibrium notion, referred to as the strategically
    robust equilibrium. Strategically robust equilibria (i) interpolate between Nash and security strategies;
    (ii) come at no additional computational cost compared to Nash equilibria; (iii) often lead to better
    decisions and higher payoffs—yielding a surprising "coordination via robustification" effect. I then
    show how strategic robustness can be used for multi-agent reinforcement learning: each agent is trained
    against a fictitious adversary regularized around its counterpart. Both in standard games such as
    congestion games and Cournot competition and in complex AI environments, including a multi-LLM debate,
    strategic robustness yields agents that are more robust, more cooperative, and more generalizable.'
  bio: Nicolas Lanzetti is a postdoctoral scholar in the Department of Computing and Mathematical Sciences
    at the California Institute of Technology, hosted by Profs. Adam Wierman, Eric Mazumdar, and Steven
    Low. He completed his PhD at the Automatic Control Laboratory at ETH Zurich, under the supervision
    of Prof. Florian Dörfler (main advisor) and Prof. Alessio Figalli (second advisor). Previously, he
    received his B.Sc. and M.Sc. in Mechanical Engineering, with a focus on Robotics, Systems, and Control
    from ETH Zurich in 2016 and 2019, respectively. He was a visiting researcher at the Massachusetts
    Institute of Technology, Stanford University, and EPFL. His research enables AI-driven decision-making
    in critical engineering, business, and societal infrastructure by developing the theoretical and algorithmic
    foundations for strategic dynamic decision-making under uncertainty.
