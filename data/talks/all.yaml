- id: 2026-07-08-gleb-polevoy
  date: '2026-07-08'
  time: 12.30-13.30
  mode: in-person
  location: ME-Lecture Hall F
  speaker: Gleb Polevoy
  affiliation_short: UO
  affiliation_full: University of Opole — Institute of Computer Science
  role: PhD
  title: Attaining Equilibria Using Control Sets
  abstract: "Many interactions stabilise in a socially suboptimal equilibrium, or move through non-equilibrium\
    \ states,\nfrom which arriving at the desired equilibrium through practical dynamics is either too\
    \ lengthy or impossible.\nThus, we formulate a new theoretically and practically interesting direct\
    \ control set problem for\nthe planner: Given a game, any profile s and any desired equilibrium d,\
    \ find a minimum\nsubset A of the players, then d becomes a best response for everyone outside A.\n\
    \nWe first show that if the desired equilibrium has certain direct control sets, then this equilibrium\
    \ must be strong.\nWe prove that the direct control set optimisation problem is NP-hard and inapproximable\
    \ within\nfactor~$n^{1 - \\epsilon}$, for any $\\epsilon > 0$. We then solve the problem for the particular\
    \ case of the game\ngraph being a tree, and approximate the solution within the number of players\
    \ influencing another player's utility,\nusing local ratio. We then study hardness and approximation\
    \ systematically,\n considering potential and then harmonic games, which span the finite games. For\
    \ potential games, finding\na direct control set, even with a constant-factor approximation, is still\
    \ \\NP-hard, but we solve this problem\nfor singleton congestion games and closely treat specific\
    \ potential games, such as coordination games on graphs\nand symmetric games. As for harmonic games,\
    \ we solve the two-player games, and prove that for more players,\nthe problem is almost as hard as\
    \ for general games. Finally, we consider natural variations on\nthe direct control set problem, paving\
    \ the way to multiple future studies."
  bio: 'I have worked in Israel, the Netherlands, Germany and Poland. My interests include

    approximation algorithms, game theory, and algorithmic game theory.'
