- id: 2025-11-05-anna-lukina
  date: '2025-11-05'
  time: 12.30-13.30
  mode: in-person
  location: Cancelled
  speaker: Anna Lukina
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Faculty of Electrical Engineering, Mathematics and Computer Science
  role: Asst. Prof.
  title: 'Advancing Safe Autonomy: Neural Certificates, Reusable Guarantees, and Interpretable Policies'
  abstract: 'Recent advances in neural certification and reinforcement learning are enabling safer and
    more adaptable autonomous systems. This talk unites four key contributions: First, I will discuss
    neural continuous-time supermartingale certificates, which provide probabilistic safety guarantees
    for continuous-time stochastic systems. Second, I will introduce VeRecycle, a theoretical framework
    for efficiently reusing probabilistic certificates after system changes, drastically reducing the
    need for costly re-certification. I will also present a modular approach to reinforcement learning,
    where formally verified sub-policies are safely composed for end-to-end guarantees. Finally, I will
    demonstrate how interpretable policies can be synthesized directly from black-box simulations using
    search and optimization. Together, these works push the boundaries of safe, scalable, and adaptive
    autonomy in uncertain environments.'
