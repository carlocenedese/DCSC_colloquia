- id: 2025-10-15-mattia-bianchi
  date: '2025-10-15'
  time: 12:30-13:30
  mode: in-person
  location: ME-Hall H
  speaker: Mattia Bianchi
  affiliation_short: ETH Zurich
  affiliation_full: ETH Zurich
  role: Postdoc
  title: Timescale separation and market schemes in Online Feedback Optimization
  abstract: "Online Feedback Optimization (OFO) is a control approach to drive a dynamical plant to an\
    \ optimal steady state. By interconnecting iterative optimization algorithms with real-time plant\
    \ measurements, OFO provides all the benefits of feedback control, yet without requiring exact knowledge\
    \ of plant dynamics for computing a setpoint. This approach has attracted remarkable research effort\
    \ in recent years, especially encouraged by promising experiments in power networks. \n\nIn this talk,\
    \ I will present some recent advances in OFO. First, I will discuss the \"timescale separation\" problem.\
    \ The common understanding was that ensuring stability of OFO would require the optimization algorithm\
    \ to be sufficiently slower than the plant to control; it turns out that this timescale separation\
    \ can be avoided in many cases, improving transient performance and adaptability. Second, I will introduce\
    \ a distributed OFO scheme, that admits a market-compatible implementation, and demonstrate its potential\
    \ on an optimal power flow problem for energy markets."
  bio: Mattia Bianchi is a postdoctoral researcher in the Automatic Control Laboratory at ETH, Zürich,
    since March 2023. He received a PhD in Game Theory and Control from the Delft Center for Systems and
    Control, TU Delft, in 2023. He received the bachelor’s degree in information and communication engineering
    in 2016, and the master’s degree in systems engineering in 2018, both from University of L’Aquila,
    Italy. From February to June 2018 he visited the Mechanical Engineering department, TU Eindhoven.
    From September 2021 to March 2022 he visited the Mechanical and Aerospace Engineering Department,
    University of California San Diego. His current research focuses on exploiting optimization and game
    theoretic algorithms to develop efficient and robust methods for decision and control in complex network
    systems, for applications in power grids, energy markets, and communication networks.
