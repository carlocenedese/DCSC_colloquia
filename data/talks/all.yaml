- id: 2025-05-21-sreeshma-markkassery
  date: '2025-05-21'
  time: 12.30-13.30
  mode: in-person
  location: ME, Hall I
  speaker: Sreeshma Markkassery
  affiliation_short: TU Delft
  affiliation_full: TU Delft — Delft Center for Systems and Control (DCSC)
  role: PhD
  title: Max-min-plus-scaling (MMPS) systems on a discrete-event framework
  abstract: "Event-driven systems, such as large traffic networks, small latches in a digital circuit,\
    \ and production units form a major class of dynamic systems. The dynamics of these systems evolve\
    \ with respect to some events and hence are called discrete event systems (DES). Descriptions in max-plus\
    \ algebra has been extensively used to model DESs in the literature. These models are often linear\
    \ in max-plus algebra (max-plus linear models) and hence their modelling capability is limited. A\
    \ max-min-plus-scaling (MMPS) system is a nonlinear modeling approach that uses operations from three\
    \ algebras: max-plus, min-plus and the conventional plus-times algebra. \n\nThis talk will focus on\
    \ the dynamics of discrete-event systems described as MMPS models. We will present a matrix canonical\
    \ form of MMPS systems that are implicit and discuss various characteristics of these systems. Based\
    \ on this model, we analyze the asymptotic growth rate and fixed points that characterizes the global\
    \ behavior. Further we also discuss the local stability of MMPS systems around a fixed point and some\
    \ future works."
  bio: TBD
