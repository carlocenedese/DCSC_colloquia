- id: 2026-06-02-giannis-delimpaltadakis
  date: '2026-06-02'
  time: 13:45-14:45
  mode: in-person
  location: ME-Lecture Hall F
  speaker: Giannis Delimpaltadakis
  affiliation_short: AI4I Institute
  affiliation_full: AI4I Institute — RIAS Lab, Turin, Italy
  role: TBD
  title: 'An information Theory of Finite Abstractions: fundamental scalability limits and what to do
    next'
  abstract: 'Finite abstractions are discrete approximations of dynamical systems, such that the set of
    abstraction trajectories contains all system trajectories. They have been very popular for verification
    and control of complex systems. There is a consensus that abstractions suffer from the curse of dimensionality:
    for the same ``accuracy" (how closely the abstraction represents the system), the abstraction size
    scales poorly with system dimensions. And yet, after decades of research on abstractions, there have
    been no formal results on their size-accuracy tradeoff. In this talk, based on a recent work of mine
    and Gabriel Gleizer, I will present a statistical, quantitative theory of abstractions'' size-accuracy
    tradeoff and uncover fundamental limits on their scalability, by striking a formal connection with
    rate-distortion theory -- the information theory of lossy compression. Abstractions are viewed as
    information-theoretic encoders of dynamical systems. Rate measures abstraction size, while distortion
    describes accuracy, defined as the spatial average deviation between abstract trajectories and system
    ones. We obtain a fundamental lower bound on the minimum achievable abstraction distortion, given
    the system dynamics and the abstraction size; and vice-versa a lower bound on the minimum size, for
    given distortion. The bound depends on the complexity of the dynamics, through a notion of trajectory
    entropy. We demonstrate its tightness on some dynamical systems. Finally, we showcase how this new
    theory enables constructing minimal abstractions, optimizing the size-accuracy tradeoff, through an
    example on a chaotic system.'
  bio: I am a Senior Research Scientist at the RIAS Lab, AI4I Institute, Turin, Italy. I obtained my diploma
    in Electrical and Computer Engineering, from NTUA, Athens, Greece, in 2018; and my PhD from DCSC,
    TU Delft, in 2022. I have previously held postdoctoral positions at TU Delft and TU Eindhoven. My
    current research interests are on control theory and its intersections with formal methods, optimization
    and information theory.
  tags:
  - Control and Learning
