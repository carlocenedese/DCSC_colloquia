- id: 2025-02-19-gerwald-lichtenberg
  date: '2025-02-19'
  time: 12.30-13.30
  mode: in-person
  location: ME, Hall G
  speaker: Gerwald Lichtenberg
  affiliation_short: HAW Hamburg
  affiliation_full: HAW Hamburg — Department of Biomedical Engineering
  role: Professor
  title: Decomposition of parameter tensors as key to large scale multilinear modeling
  abstract: The exponentially emerging complexity with the number of relevant signals leads to a curse
    of dimensionality in most nonlinear modeling approaches. Whereas for some applications, universal
    approximation properties are in the focus of the modeling approach, for large scale systems, scalability
    has first priority. One possible key to cope with this challenge is the restriction to special classes
    of nonlinearities, which allow reasonable factorizations. Not only the availability of tensor decomposition
    methods but also the intrinsic dynamic properties in applications like power networks and HVAC systems
    can motivate, why multilinear time-invariant (MTI) models are of special interest. Basic concepts
    will be presented as well as application examples together with the MTI-Toolbox developed at HAW Hamburg.
  bio: Gerwald Lichtenberg studied Physics at the Universities of Heidelberg and Hamburg, received his
    PhD in control engineering 1998 from the Hamburg University of Technology (TUHH) - supervised by Jan
    Lunze and his habilitation in systems theory from TUHH in 2012. Since 2013, he is Professor of Physics
    and Control Engineering at the Faculty of Life Sciences of the University of Applied Sciences (HAW)
    and scientific director of the Fraunhofer application center for Integration of Local Energy Systems
    ILES, both in Hamburg. His research areas are in the fields of model-based and learning control as
    well as fault diagnosis and supervisory control of complex systems such as local energy networks,
    building systems, or particle accelerators. Multilinear modeling methods and applications of tensor
    decomposition methods for control engineering problems are main foci of his work.
