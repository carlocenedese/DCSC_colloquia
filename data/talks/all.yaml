- id: 2025-11-19-emily-yu
  date: '2025-11-19'
  time: 12.30-13.30
  mode: in-person
  location: ME, Hall E, Robert Hooke
  speaker: Emily Yu
  affiliation_short: Leiden
  affiliation_full: Leiden University
  role: Asst. Prof.
  title: 'Symbolic Verification and Neural Control via Certification

    Research cluster: Control and learning'
  abstract: "As intelligent systems increasingly rely on learning-enabled components in safety-critical\
    \ domains, the central challenge becomes obtaining a sufficient level of trust in their correctness\
    \ for real-world deployment. Our approach is through certification.\n \nCertificates are independently\
    \ machine-checkable evidences, that provide a verifiable layer of correctness on top of both symbolic\
    \ and learned components.\n \nIn this talk, I will present certification as a unifying lens across\
    \ hardware circuits and neural control systems. First, I will show how certification has reshaped\
    \ hardware verification, allowing us to decouple trust from complex automated reasoning engines such\
    \ that verification results can be independently validated. Then I will extend the same principles\
    \ to learning-based control, where certificates provide mathematically grounded guarantees and can\
    \ be used for real-time safety assurance. I will conclude by outlining a vision of certified autonomy\
    \ with a unified certificate-based architecture that connects symbolic reasoning and neural learning."
  bio: Emily Yu is an assistant professor in the Leiden Institute of Advanced Computer Science at Leiden
    University. Her research focuses on system verification and trustworthy AI, with a focus on advancing
    formal methods as first-order design principles for correctness and security. A central theme of her
    work is leveraging formal methods techniques to design and verify hardware systems as well as AI-based
    systems. Emily’s research has been recognized with an Esprit fellowship from the Austrian Science
    Fund.
