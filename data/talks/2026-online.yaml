- id: 2026-05-06-dinesh-krishnamoorthy
  date: '2026-05-06'
  time: 15:00 -- 16:00
  mode: online
  location: Online
  speaker: Dinesh Krishnamoorthy
  affiliation_short: NTNU
  affiliation_full: Norwegian University of Science and Technology — Department of Engineering Cybernetics
  role: Associate Prof.
  title: 'Complexity reduction in Model Predictive Control: Learning from experts with guarantees.'
  abstract: "Model Predictive Control (MPC) is among the most powerful tools in modern control engineering,\
    \ yet its computational demands can make it impractical for resource-constrained, embedded platforms\
    \ where decisions must happen fast. So how do we keep the performance without paying the price? \n\
    In this talk, we explore a learning-based framework for distilling the intelligence of a high-complexity\
    \ \"expert\" MPC into a lightweight controller that hoefully retains some level of performance and\
    \ theoretical guarantees. We begin by asking: what exactly are we learning when we learn from an expert\
    \ policy, and what can we actually guarantee about the result?We argue that learning the value function\
    \ rather than the policy directly is a more principled route, enabling a myopic one-step lookahead\
    \ MPC that sidesteps the computational burden of long prediction horizons. Along the way, we discuss\
    \ what closed-loop properties such an approach can provably preserve. Perhaps most provocatively,\
    \ we examine these methods through the lens of pedagogy: just as there are different levels of cognitive\
    \ learning in human education (from rote memorization to creating something new), different learning-based\
    \ control methods implicitly target different levels of \"intelligence.\" The talk will briefly discuss\
    \ what cognitive level of intelligence are we actually teaching our controllers?\nResearch theme:\
    \ Control and Learning"
  bio: Dinesh Krishnamoorthy is an Associate professor at the Department of Engineering Cybernetics at
    NTNU. From 2022 - 2025, he was an Assistant Professor at the Department of Mechanical Engineering
    at TU Eindhoven, and between 2021-2022, he was a post-doctoral researcher at Harvard John A. Paulson
    School of Engineering and Applied Sciences. Dinesh received his PhD in Process Systems Engineering
    from the Norwegian University of Science and Technology (NTNU), MSc in Control Systems from Imperial
    College London, and B.Eng in Mechatronics from the University of Nottingham. Dinesh was a recipient
    of the Dimitirs. N. Chorafas Foundation Award, EuroTech Future Award, as well as a IFAC Young author
    award. His research interests include distributed optimization, learning-based optimal control, real-time
    optimization, and Bayesian optimization.
